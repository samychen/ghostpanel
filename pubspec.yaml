name: ghostpanel
description: "GhostPanel — 在手机上掌控你的 Linux 工作站，而桌面毫无察觉。零打扰远程工作站管理面板。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # SSH 协议栈（纯 Dart 实现，无原生依赖）—— 方案文档 §7.2
  dartssh2: ">=2.8.0 <3.0.0"

  # 状态管理 —— 方案文档 §7.2
  flutter_riverpod: ">=2.5.0 <3.0.0"

  # 仪表盘图表 —— 方案文档 §7.2
  fl_chart: ">=0.69.0 <2.0.0"

  # 终端渲染（ANSI/PTY 前端）
  xterm: ">=3.0.0 <5.0.0"

  # 本地存储：服务器配置 / 任务历史 / Snippets
  shared_preferences: ">=2.2.0 <3.0.0"

  # 文件下载目录 / 上传选择器
  path_provider: ">=2.1.0 <3.0.0"
  file_picker: ">=8.0.0 <11.0.0"

  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
